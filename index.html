<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園課節查詢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for better mobile experience */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

    <div class="max-w-md mx-auto bg-white min-h-screen sm:min-h-0 sm:my-8 sm:rounded-xl shadow-lg overflow-hidden border-x border-gray-100 relative">
        
        <!-- Header -->
        <div class="bg-emerald-600 p-6 text-white text-center shadow-sm">
            <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
                <!-- BookOpen Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 1-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                校園課節查詢
            </h1>
            <p class="text-emerald-100 text-sm mt-1">2026–2027 星期一至五課堂資訊</p>
        </div>

        <!-- Day Selector -->
        <div class="p-4 bg-emerald-50 border-b border-emerald-100">
            <div class="flex items-center gap-2 mb-2 text-emerald-800 font-semibold text-sm">
                <!-- Calendar Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                選擇星期
            </div>
            <div class="grid grid-cols-5 gap-1" id="day-buttons-container">
                <!-- Day buttons will be injected here -->
            </div>
        </div>

        <!-- Mode Toggle -->
        <div class="flex border-b border-gray-200">
            <button id="btn-mode-class" class="flex-1 py-3 text-sm font-medium flex items-center justify-center gap-2 transition-colors bg-white text-emerald-600 border-b-2 border-emerald-600">
                <!-- Users Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                查班級課表
            </button>
            <button id="btn-mode-teacher" class="flex-1 py-3 text-sm font-medium flex items-center justify-center gap-2 transition-colors bg-gray-50 text-gray-500 hover:bg-gray-100">
                <!-- User Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                查老師課節
            </button>
        </div>

        <!-- Content Area -->
        <div class="p-4 min-h-[400px]" id="content-area">
            
            <!-- Class View (Hidden by default, toggled by JS) -->
            <div id="view-class" class="fade-in">
                <label class="block text-sm font-medium text-gray-700 mb-2">選擇班級</label>
                <div class="relative mb-6">
                    <select id="select-class" class="block w-full pl-3 pr-10 py-3 text-base border-gray-300 bg-gray-50 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm rounded-lg border shadow-sm appearance-none text-gray-700 cursor-pointer">
                        <!-- Options injected by JS -->
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down"><path d="m6 9 6 6 6-6"/></svg>
                    </div>
                </div>

                <h3 id="class-view-title" class="text-lg font-bold text-gray-800 border-l-4 border-emerald-500 pl-3 mb-4">
                    星期一 - 1信班 課表
                </h3>
                <div id="class-schedule-list" class="space-y-3">
                    <!-- Schedule items injected by JS -->
                </div>
            </div>

            <!-- Teacher View (Hidden by default) -->
            <div id="view-teacher" class="hidden fade-in">
                <label class="block text-sm font-medium text-gray-700 mb-2">搜尋或選擇老師</label>
                <div class="relative mb-3">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    </div>
                    <input type="text" id="teacher-search-input" placeholder="輸入老師代號搜尋，例如：徐、陳" 
                        class="block w-full pl-10 pr-3 py-3 text-base border-gray-300 bg-gray-50 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm rounded-lg border shadow-sm text-gray-700">
                </div>
                <div class="relative mb-6">
                    <select id="select-teacher" class="block w-full pl-3 pr-10 py-3 text-base border-gray-300 bg-gray-50 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm rounded-lg border shadow-sm appearance-none text-gray-700 cursor-pointer">
                        <!-- Options injected by JS -->
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down"><path d="m6 9 6 6 6-6"/></svg>
                    </div>
                </div>

                <h3 id="teacher-view-title" class="text-lg font-bold text-gray-800 border-l-4 border-emerald-500 pl-3 mb-4">
                    星期一 - 老師任教課節
                </h3>
                
                <div id="teacher-schedule-list" class="space-y-3">
                     <!-- Schedule items injected by JS -->
                </div>
            </div>

        </div>
        
        <!-- Footer -->
        <div class="bg-gray-50 p-4 text-center text-xs text-gray-400 border-t border-gray-100">
            <span id="data-source-label">資料來源：2026–2027 學校時間表</span>
            <span class="block mt-1">圖書課：單周中圖、雙周英圖</span>
        </div>
    </div>

    <script>
        // --- Data ---
        let scheduleData = {};

        // --- State ---
        let teacherScheduleData = {};
        let periodTimes = [];
        let schoolYear = "";
        let selectedDay = "星期一";
        let searchMode = "class"; // 'class' or 'teacher'
        let selectedClass = "1信";
        let selectedTeacher = "";
        let teacherOptions = [];

        // --- Utils ---
        let days = [];
        let classList = [];

        const extractTeacher = (str) => {
            const match = str.match(/\((.*?)\)/);
            return match ? match[1] : null;
        };

        // Initialize Teacher Options
        const initTeachers = () => {
            const currentTeacherCodes = Object.keys(teacherScheduleData);
            if (currentTeacherCodes.length > 0) {
                teacherOptions = currentTeacherCodes.sort((a, b) => a.localeCompare(b, 'zh-HK'));
                selectedTeacher = teacherOptions[0];
                return;
            }

            const teachers = new Set();
            Object.values(scheduleData).forEach(dayData => {
                Object.values(dayData).forEach(periods => {
                    periods.forEach(period => {
                        const teacher = extractTeacher(period);
                        if (teacher) teachers.add(teacher);
                    });
                });
            });
            teacherOptions = Array.from(teachers).sort();
            if (teacherOptions.length > 0) {
                selectedTeacher = teacherOptions[0];
            }
        };

        // --- Render Functions ---

        const renderDayButtons = () => {
            const container = document.getElementById('day-buttons-container');
            container.innerHTML = '';
            days.forEach(day => {
                const btn = document.createElement('button');
                btn.textContent = day;
                btn.className = `py-2 px-1 rounded-lg text-xs sm:text-sm font-medium transition-colors ${
                    selectedDay === day 
                    ? 'bg-emerald-600 text-white shadow-md' 
                    : 'bg-white text-gray-600 border border-gray-200 hover:bg-emerald-50'
                }`;
                btn.onclick = () => {
                    selectedDay = day;
                    render();
                };
                container.appendChild(btn);
            });
        };

        const renderClassOptions = () => {
            const select = document.getElementById('select-class');
            select.innerHTML = '';
            classList.forEach(cls => {
                const opt = document.createElement('option');
                opt.value = cls;
                opt.textContent = cls + '班';
                if(cls === selectedClass) opt.selected = true;
                select.appendChild(opt);
            });
            select.onchange = (e) => {
                selectedClass = e.target.value;
                renderClassSchedule();
            };
        };

        const renderTeacherOptions = (filter = '') => {
            const select = document.getElementById('select-teacher');
            select.innerHTML = '';
            const filtered = filter 
                ? teacherOptions.filter(t => t.includes(filter))
                : teacherOptions;
            filtered.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t + ' 老師';
                if(t === selectedTeacher) opt.selected = true;
                select.appendChild(opt);
            });
            // If current selection not in filtered list, auto-select first match
            if (filtered.length > 0 && !filtered.includes(selectedTeacher)) {
                selectedTeacher = filtered[0];
                select.value = selectedTeacher;
                renderTeacherSchedule();
            } else if (filtered.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '找不到符合的老師';
                opt.disabled = true;
                opt.selected = true;
                select.appendChild(opt);
            }
            select.onchange = (e) => {
                selectedTeacher = e.target.value;
                renderTeacherSchedule();
            };
        };

        const renderClassSchedule = () => {
            const title = document.getElementById('class-view-title');
            title.textContent = `${selectedDay} - ${selectedClass}班 課表`;

            const list = document.getElementById('class-schedule-list');
            list.innerHTML = '';

            const schedule = scheduleData[selectedDay]?.[selectedClass] || [];

            schedule.forEach((subject, idx) => {
                const div = document.createElement('div');
                div.className = 'flex items-center p-3 bg-white rounded-lg border border-gray-100 shadow-sm hover:shadow-md transition-shadow';
                div.innerHTML = `
                    <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-700 font-bold text-lg mr-4 shrink-0">
                        ${idx + 1}
                    </div>
                    <div>
                        <div class="text-gray-500 text-xs uppercase tracking-wide">第 ${idx + 1} 節${periodTimes[idx] ? ` · ${periodTimes[idx]}` : ''}</div>
                        <div class="text-gray-900 font-medium text-lg">${subject}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        };

        const renderTeacherSchedule = () => {
            const title = document.getElementById('teacher-view-title');
            title.textContent = `${selectedDay} - ${selectedTeacher}老師任教課節`;

            const list = document.getElementById('teacher-schedule-list');
            list.innerHTML = '';

            const result = [];
            const teacherDayData = teacherScheduleData[selectedTeacher]?.[selectedDay];

            if (teacherDayData) {
                Object.entries(teacherDayData).forEach(([period, entries]) => {
                    entries.forEach(entry => {
                        result.push({
                            period: Number(period),
                            className: entry.className,
                            subject: entry.subject
                        });
                    });
                });
            } else {
                const dayData = scheduleData[selectedDay] || {};
                Object.keys(dayData).forEach(className => {
                    const periods = dayData[className];
                    periods.forEach((subjectStr, index) => {
                        const teacher = extractTeacher(subjectStr);
                        if (teacher === selectedTeacher) {
                            result.push({
                                period: index + 1,
                                className: className,
                                subject: subjectStr
                            });
                        }
                    });
                });
            }
            
            result.sort((a, b) => a.period - b.period);

            if (result.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-10 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock text-gray-300 mx-auto mb-2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <p class="text-gray-500">這位老師在 ${selectedDay} 沒有課堂</p>
                    </div>
                `;
            } else {
                result.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'flex items-center justify-between p-3 bg-white rounded-lg border border-gray-100 shadow-sm hover:shadow-md transition-shadow';
                    div.innerHTML = `
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center text-orange-700 font-bold mr-3 shrink-0">
                                ${item.period}
                            </div>
                            <div>
                                <div class="text-gray-900 font-bold">${/^[1-6][信望愛智]$/.test(item.className) ? `${item.className}班` : item.className}</div>
                                <div class="text-gray-500 text-sm">${item.subject}</div>
                            </div>
                        </div>
                        <div class="px-3 py-1 bg-gray-100 text-gray-600 text-xs rounded-full font-medium">
                            第 ${item.period} 節${periodTimes[item.period - 1] ? `<br><span class="text-[10px]">${periodTimes[item.period - 1]}</span>` : ''}
                        </div>
                    `;
                    list.appendChild(div);
                });
            }
        };

        const updateModeUI = () => {
            const btnClass = document.getElementById('btn-mode-class');
            const btnTeacher = document.getElementById('btn-mode-teacher');
            const viewClass = document.getElementById('view-class');
            const viewTeacher = document.getElementById('view-teacher');

            if (searchMode === 'class') {
                btnClass.className = 'flex-1 py-3 text-sm font-medium flex items-center justify-center gap-2 transition-colors bg-white text-emerald-600 border-b-2 border-emerald-600';
                btnTeacher.className = 'flex-1 py-3 text-sm font-medium flex items-center justify-center gap-2 transition-colors bg-gray-50 text-gray-500 hover:bg-gray-100';
                viewClass.classList.remove('hidden');
                viewTeacher.classList.add('hidden');
            } else {
                btnClass.className = 'flex-1 py-3 text-sm font-medium flex items-center justify-center gap-2 transition-colors bg-gray-50 text-gray-500 hover:bg-gray-100';
                btnTeacher.className = 'flex-1 py-3 text-sm font-medium flex items-center justify-center gap-2 transition-colors bg-white text-emerald-600 border-b-2 border-emerald-600';
                viewClass.classList.add('hidden');
                viewTeacher.classList.remove('hidden');
            }
        };

        const render = () => {
            renderDayButtons();
            updateModeUI();
            if (searchMode === 'class') {
                renderClassSchedule();
            } else {
                renderTeacherSchedule();
            }
        };

        // --- Init ---
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('./schedule-data.json', { cache: 'no-cache' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const timetableData = await response.json();
                scheduleData = timetableData.scheduleData;
                teacherScheduleData = timetableData.teacherScheduleData || {};
                periodTimes = timetableData.periodTimes || [];
                schoolYear = timetableData.schoolYear || '';
                days = timetableData.days || Object.keys(scheduleData);
                classList = timetableData.classNames || Object.keys(scheduleData[days[0]]);
                selectedDay = days[0];
                selectedClass = classList[0];
                if (schoolYear) {
                    document.getElementById('data-source-label').textContent = `資料來源：${schoolYear} 學生及教師時間表`;
                }
            } catch (error) {
                console.error('未能載入最新課表資料：', error);
                document.getElementById('data-source-label').textContent = '未能載入 2026–2027 課表資料，請重新整理';
                document.getElementById('content-area').innerHTML = `
                    <div class="text-center py-12 px-4 bg-red-50 border border-red-100 rounded-lg">
                        <p class="font-semibold text-red-700">未能載入最新課表資料</p>
                        <p class="mt-2 text-sm text-red-600">請重新整理頁面；如問題持續，請聯絡管理員。</p>
                    </div>
                `;
                return;
            }

            initTeachers();
            renderClassOptions();
            renderTeacherOptions();

            // Teacher search input
            const searchInput = document.getElementById('teacher-search-input');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                renderTeacherOptions(query);
                if (query && document.getElementById('select-teacher').value) {
                    renderTeacherSchedule();
                }
            });

            document.getElementById('btn-mode-class').onclick = () => {
                searchMode = 'class';
                render();
            };
            document.getElementById('btn-mode-teacher').onclick = () => {
                searchMode = 'teacher';
                render();
            };

            render();
        });

    </script>
</body>
</html>
